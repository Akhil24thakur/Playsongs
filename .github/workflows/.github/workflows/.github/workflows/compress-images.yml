name: Compress Images

on:
  # Allow manual run
  workflow_dispatch:

  # Auto-run whenever files inside playsongs/images change
  push:
    paths:
      - "playsongs/images/**"

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      # Pull your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optimize images in playsongs/images/
      - name: Optimize images
        uses: calibreapp/image-actions@v1.1.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

          # ✅ Where your images are located
          jpgPath: "playsongs/images"
          pngPath: "playsongs/images"
          webpPath: "playsongs/images"

          # ✅ Compression quality (recommended)
          jpegQuality: "70"
          pngQuality: "70"
          webpQuality: "70"

          # ✅ Resize max dimensions (good for album covers)
          maxWidth: 800
          maxHeight: 800

          # ✅ Overwrite same files (no new PR)
          compressOnly: true
