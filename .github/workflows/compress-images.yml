name: Compress Images

on:
  workflow_dispatch:
  push:
    paths:
      - "images/**"

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install sharp-cli
        run: npm i -g sharp-cli@^2

      # JPG / JPEG
      - name: Optimize JPG
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p optimized
          sharp -i "images/*.{jpg,JPG,jpeg,JPEG}" \
            -o optimized/ \
            --width 800 --height 800 --fit inside --withoutEnlargement \
            --quality 70 --progressive

      # PNG
      - name: Optimize PNG
        shell: bash
        run: |
          shopt -s nullglob
          sharp -i "images/*.{png,PNG}" \
            -o optimized/ \
            --width 800 --height 800 --fit inside --withoutEnlargement \
            --compressionLevel 9

      # WebP
      - name: Optimize WebP
        shell: bash
        run: |
          shopt -s nullglob
          sharp -i "images/*.{webp,WEBP}" \
            -o optimized/ \
            --width 800 --height 800 --fit inside --withoutEnlargement \
            --quality 70

      - name: Copy back to images/
        run: |
          if [ -d optimized ]; then
            cp -f optimized/* images/ 2>/dev/null || true
          fi

      - name: Commit optimized images (if changed)
        run: |
          if [ -n "$(git status --porcelain images)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images
            git commit -m "Optimize images via sharp-cli (max 800px, q=70)"
            git push
          else
            echo "No image changes to commit."
          fi
