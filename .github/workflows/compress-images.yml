name: Compress Images

on:
  workflow_dispatch:
  push:
    paths:
      - "images/**"

# allow the job to push commits back
permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install imagemin CLI tools
        run: |
          npm install -g imagemin-cli imagemin-mozjpeg imagemin-pngquant imagemin-webp

      - name: Compress JPG/PNG to ./optimized
        run: |
          mkdir -p optimized
          # JPG + PNG
          imagemin images/*.{jpg,JPG,jpeg,JPEG,png,PNG} \
            --plugin=mozjpeg={quality:70} \
            --plugin=pngquant={quality:[0.6,0.8]} \
            --out-dir=optimized || true
          # WEBP
          imagemin images/*.{webp,WEBP} \
            --plugin=webp={quality:70} \
            --out-dir=optimized || true

      - name: Copy back into images/
        run: |
          if [ -d optimized ]; then
            cp -f optimized/* images/ 2>/dev/null || true
          fi

      - name: Commit optimized images (if any)
        run: |
          if [ -n "$(git status --porcelain images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images
            git commit -m "Optimize images"
            git push
          else
            echo "No image changes to commit."
          fi
