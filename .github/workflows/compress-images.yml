name: Compress Images

on:
  workflow_dispatch:
  push:
    paths:
      - "images/**"

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install imagemin CLI tools
        run: |
          npm install -g imagemin-cli imagemin-mozjpeg imagemin-pngquant imagemin-webp

      - name: Compress images
        run: |
          mkdir -p optimized
          imagemin images/*.{jpg,jpeg,png} --plugin=mozjpeg={quality:70} --plugin=pngquant={quality:[0.6,0.8]} > /dev/null 2>&1 || true
          cp -r images/* optimized/ || true
          imagemin images/*.{webp} --plugin=webp={quality:70} > /dev/null 2>&1 || true
          cp -r optimized/* images/
