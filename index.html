<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="images/icon.png" style="height: 500px;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="music-player">
            <h1 class="music-player-title">Now Playing</h1>
            <img src="images/lost.webp" alt="Song Cover" id="cover-art" class="cover-art">

            <div class="song-details">
                <h2 id="song-title">Once Lost Now Found</h2>
                <p id="song-artist">Akhil</p>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-container">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
                <button id="play-pause-btn" class="control-btn play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
            </div>
            
            <audio id="audio-source"></audio>
        </div>

        <div class="playlist-container">
            <h1 class="playlist-title">My Playlist</h1>
            <ul id="playlist" class="playlist">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
